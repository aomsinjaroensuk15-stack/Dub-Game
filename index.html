<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<title>Dub Roast 🎤 — voice dub game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <h1>🎤 Dub Roast</h1>
    <p class="tagline">import a sound &middot; dub it &middot; get roasted</p>
  </header>

  <!-- DROP -->
  <section id="screen-drop" class="screen">
    <label class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.m4a,.ogg,.webm" hidden>
      <span class="dz-icon">🎧</span>
      <span class="dz-title">Tap to import sound</span>
      <span class="dz-sub">mp3 &middot; wav &middot; m4a &middot; ogg</span>
    </label>
    <p class="footnote">works best in Chrome, on HTTPS (GitHub Pages 😉)</p>
  </section>

  <!-- MAIN -->
  <section id="screen-main" class="screen hidden">
    <div class="clip-info">
      <span id="clip-name" class="clip-name">—</span>
      <span id="clip-duration" class="pill">0s</span>
      <span id="clip-best" class="pill pill-gold hidden"></span>
    </div>
    <canvas id="wave-canvas" class="wave"></canvas>
    <div id="controls-ready" class="controls">
      <button id="btn-preview" class="btn">▶ Preview</button>
      <button id="btn-start" class="btn btn-big">🎤 Start Dubbing</button>
    </div>
    <div id="controls-record" class="controls controls-record hidden">
      <span class="rec"><span class="rec-dot"></span>REC</span>
      <button id="btn-stop" class="btn btn-big btn-danger">⏹ Stop</button>
    </div>
    <p id="hint" class="hint">mic records while the clip plays — sing your heart out</p>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="screen screen-results hidden">
    <div id="flames" class="flames"></div>
    <div class="results-card">
      <div class="results-label">Results</div>

      <div id="judging" class="judging">Judging your performance<span class="dots"></span> 😈</div>

      <div id="score-block" class="hidden">
        <div id="score-percent" class="score-percent">0%</div>
        <div id="new-best" class="new-best hidden">✨ new best! ✨</div>
        <div id="score-msg" class="score-msg"></div>
        <div class="score-detail">
          <div class="sd-row"><span>Rhythm</span><div class="bar"><div id="bar-env"></div></div></div>
          <div class="sd-row"><span>Pitch</span><div class="bar"><div id="bar-pitch"></div></div></div>
          <div class="sd-row"><span>Timing</span><div class="bar"><div id="bar-dur"></div></div></div>
        </div>
      </div>

      <canvas id="results-wave" class="wave wave-results hidden"></canvas>
      <div id="legend" class="legend hidden">
        <span class="lg lg-clip">clip</span>
        <span class="lg lg-you">you</span>
      </div>

      <audio id="take-audio" controls class="take-audio"></audio>
      <div class="controls">
        <a id="btn-download" class="btn btn-dl" href="#" download>⬇️ Download take</a>
        <button id="btn-retry" class="btn">🔁 Retry</button>
        <button id="btn-new" class="btn">🎧 New Clip</button>
      </div>
    </div>
  </section>

</div>

<div id="countdown" class="countdown hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="scoring.js"></script>
<script src="waveform.js"></script>
<script src="app.js"></script>
</body>
</html>
